openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Examiner Co-Pilot API. Agents propose, examiners decide.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Workspace mode (demo or live) and progress through the review steps
  - name: llm
    description: Language model provider status
  - name: users
    description: Signed-in people and their roles
  - name: audit
    description: Append-only audit log
  - name: library
    description: Banks, card products and the versioned rulebook
  - name: documents
    description: Uploaded disclosure PDFs and their extracted pages
  - name: assessments
    description: Agent runs that propose a status per rule, with evidence checked by code
  - name: review
    description: Examiner decisions on proposed findings (append-only)
  - name: notices
    description: Findings reports (draft notices); drafts only, never sent
  - name: scoring
    description: Scoring rubric, document roles and complaint data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /workspace/status:
    get:
      operationId: getWorkspaceStatus
      tags: [workspace]
      summary: Current workspace mode and dataset
      responses:
        "200":
          description: Workspace status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStatus"

  /workspace/maker-checker-mode:
    put:
      operationId: setMakerCheckerMode
      tags: [workspace]
      summary: Change the maker-checker mode (senior examiners only; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MakerCheckerModeInput"
      responses:
        "200":
          description: Updated workspace status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStatus"

  /workspace/progress:
    get:
      operationId: getWorkspaceProgress
      tags: [workspace]
      summary: Progress through the four review steps, with counts, for the active dataset
      responses:
        "200":
          description: Step progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceProgress"

  /llm/status:
    get:
      operationId: getLlmStatus
      tags: [llm]
      summary: Whether the model provider is configured (no call is made)
      responses:
        "200":
          description: Provider configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmStatus"

  /llm/test:
    post:
      operationId: testLlmConnection
      tags: [llm]
      summary: Make one minimal call to the provider to check the key and model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleContext"
      responses:
        "200":
          description: Result of the connection test (ok may be false with a clear error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmTestResult"

  /audit/events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Audit events for the active dataset, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: action
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Page of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"

  /audit/verify:
    get:
      operationId: verifyAuditChain
      tags: [audit]
      summary: Recompute the hash chain and report whether any event was altered
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditChainVerification"

  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: The signed-in person and their role
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Everyone who has signed in
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"

  /users/{id}/role:
    patch:
      operationId: setUserRole
      tags: [users]
      summary: Change a person's role (senior examiners only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /banks:
    get:
      operationId: listBanks
      tags: [library]
      summary: Banks with their card products, for the active dataset
      responses:
        "200":
          description: Banks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankList"
    post:
      operationId: createBank
      tags: [library]
      summary: Add a bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bank"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A bank with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /banks/{id}/products:
    post:
      operationId: createProduct
      tags: [library]
      summary: Add a card product to a bank
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bank not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This bank already has a product with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rulebooks:
    get:
      operationId: listRulebooks
      tags: [library]
      summary: Rulebooks and their versions
      responses:
        "200":
          description: Rulebooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookList"

  /rulebooks/import/preview:
    post:
      operationId: previewRulebookImport
      tags: [library]
      summary: Upload an .xlsx rulebook; returns headers, sample rows and a proposed column mapping
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookImportPreview"
        "400":
          description: Not a readable .xlsx file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rulebooks/import/commit:
    post:
      operationId: commitRulebookImport
      tags: [library]
      summary: Validate the mapped rows (dryRun) or create a new draft rulebook version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulebookImportInput"
      responses:
        "200":
          description: Validation or import result (valid may be false with row errors)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookImportResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rulebook-versions/{id}:
    get:
      operationId: getRulebookVersion
      tags: [library]
      summary: One rulebook version with its rules
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookVersionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rulebook-versions/{id}/activate:
    post:
      operationId: activateRulebookVersion
      tags: [library]
      summary: Make this version the one assessments use; the previously active version is retired
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleContext"
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookVersionSummary"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Version is retired or has no rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: Uploaded documents for the active dataset, newest first
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload one PDF disclosure; text is extracted page by page
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
        "400":
          description: Not a valid PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The same file is already uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateFileError"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: One document with its extracted pages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/{id}/confirm:
    post:
      operationId: confirmDocument
      tags: [documents]
      summary: Examiner confirms bank, product, document type and language
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmDocumentInput"
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/{id}/reject:
    post:
      operationId: rejectDocument
      tags: [documents]
      summary: Examiner excludes the document from assessment, with a reason
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDocumentInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /assessments/candidates:
    get:
      operationId: listAssessmentCandidates
      tags: [assessments]
      summary: Card products and whether each is ready to assess, plus run preconditions
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentCandidates"

  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: Assessments for the active dataset, newest first
      responses:
        "200":
          description: Assessments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentList"
    post:
      operationId: startAssessment
      tags: [assessments]
      summary: Start an assessment of one card product against the active rulebook version. Runs in the background.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAssessmentInput"
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSummary"
        "400":
          description: The product is not ready (no confirmed documents or no active rulebook)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot start assessments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another assessment is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The model provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: One assessment with its agent trace, findings and evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments/{id}/stop:
    post:
      operationId: stopAssessment
      tags: [assessments]
      summary: Ask a running assessment to stop after its current step
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleContext"
      responses:
        "200":
          description: Stop requested (or already finished)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSummary"
        "403":
          description: Viewer cannot stop assessments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /documents/{id}/agent-proposal:
    post:
      operationId: requestDocumentAgentProposal
      tags: [documents]
      summary: Ask the Ingestion agent to propose type, language, bank and product. Runs in the background; poll the document.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleContext"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The model provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rulebooks/import/{importId}/agent-mapping:
    post:
      operationId: requestRulebookAgentMapping
      tags: [library]
      summary: Ask the Ingestion agent to propose a column mapping for an uploaded rulebook. Code checks the proposal.
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleContext"
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMappingProposal"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The model provider failed or gave no usable answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The model provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /deletions/{kind}/{id}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/DeleteKind"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getDeleteImpact
      tags: [library]
      summary: What deleting this item would also delete
      responses:
        "200":
          description: Impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteImpact"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteItem
      tags: [library]
      summary: Delete an item and everything that depends on it
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteImpact"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An assessment that uses this is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /review/queue:
    get:
      operationId: getReviewQueue
      tags: [review]
      summary: Findings from the latest finished assessment of each product, with the latest examiner decision
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueue"

  /findings/{id}:
    get:
      operationId: getFinding
      tags: [review]
      summary: One finding with its evidence, the source pages, and the decision history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /findings/{id}/decisions:
    post:
      operationId: decideFinding
      tags: [review]
      summary: Record an examiner decision. Append-only; the latest decision wins.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingDetail"
        "400":
          description: Invalid decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot record decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The finding belongs to an older assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /decisions/{id}/approval:
    post:
      operationId: approveDecision
      tags: [review]
      summary: A senior examiner approves or returns a decision that awaits approval. The checker must be a different person from the maker.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a senior examiner, or the checker is the maker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The decision is not awaiting approval, or a newer decision replaced it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /review/accept-compliant:
    post:
