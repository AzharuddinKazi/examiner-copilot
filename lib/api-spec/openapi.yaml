components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Dataset:
      type: string
      enum: [demo, live]

    Role:
      type: string
      enum: [examiner, senior_examiner, viewer]
      description: Assigned to each signed-in person by a senior examiner.

    MakerCheckerMode:
      type: string
      enum: [strict, poc]
      description: strict (default) needs a different senior examiner as checker; poc lets one senior examiner approve their own work, for single-user trials only.

    MakerCheckerModeInput:
      type: object
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/MakerCheckerMode" }

    WorkspaceStatus:
      type: object
      required: [mode, switchedAt, switchedByRole, oneWay, makerCheckerMode]
      properties:
        makerCheckerMode: { $ref: "#/components/schemas/MakerCheckerMode" }
        mode:
          $ref: "#/components/schemas/Dataset"
        switchedAt:
          type: ["string", "null"]
          format: date-time
        switchedByRole:
          type: ["string", "null"]
        oneWay:
          type: boolean
          description: Always true. Live cannot switch back to demo.

    StepState:
      type: string
      enum: [not_started, in_progress, done]

    StepCount:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: integer }

    StepProgress:
      type: object
      required: [key, number, title, question, href, state, counts, summary]
      properties:
        key:
          type: string
          enum: [upload, assess, review, notices]
        number: { type: integer }
        title: { type: string }
        question: { type: string }
        href: { type: string }
        state:
          $ref: "#/components/schemas/StepState"
        counts:
          type: array
          items:
            $ref: "#/components/schemas/StepCount"
        summary:
          type: string
          description: One plain sentence describing where this step stands

    WorkspaceProgress:
      type: object
      required: [dataset, steps, nextStepKey, library]
      properties:
        dataset:
          $ref: "#/components/schemas/Dataset"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepProgress"
        nextStepKey:
          type: string
          enum: [upload, assess, review, notices]
        library:
          $ref: "#/components/schemas/LibraryCounts"

    LibraryCounts:
      type: object
      required: [banks, products, rulebookVersions, activeRules]
      properties:
        banks: { type: integer }
        products: { type: integer }
        rulebookVersions: { type: integer }
        activeRules: { type: integer }

    LlmStatus:
      type: object
      required: [configured, keyPresent, modelPresent, model, provider, message]
      properties:
        configured: { type: boolean }
        keyPresent: { type: boolean }
        modelPresent: { type: boolean }
        model: { type: ["string", "null"] }
        provider: { type: string }
        message:
          type: string
          description: Plain explanation of the current state, including what to do if not configured

    LlmTestResult:
      type: object
      required: [ok, model, latencyMs, error, checkedAt]
      properties:
        ok: { type: boolean }
        model: { type: ["string", "null"] }
        latencyMs: { type: ["integer", "null"] }
        error:
          type: ["string", "null"]
          description: Clear error when the key is missing or the provider fails
        checkedAt:
          type: string
          format: date-time

    RoleContext:
      type: object
      description: Empty body. Who acts comes from the signed-in session.
      properties: {}

    User:
      type: object
      required: [id, name, email, role, createdAt, lastSeenAt]
      properties:
        id: { type: integer }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        role:
          $ref: "#/components/schemas/Role"
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }

    UserRoleInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    AuditEvent:
      type: object
      required: [id, dataset, ts, role, actor, action, entityType, entityId, summary, hash]
      properties:
        id: { type: integer }
        dataset:
          $ref: "#/components/schemas/Dataset"
        ts:
          type: string
          format: date-time
        role:
          type: ["string", "null"]
        actor:
          type: ["string", "null"]
        action: { type: string }
        entityType: { type: string }
        entityId: { type: ["string", "null"] }
        summary: { type: string }
        before: {}
        after: {}
        hash: { type: string }

    AuditEventPage:
      type: object
      required: [items, total, actions]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        total: { type: integer }
        actions:
          type: array
          description: Distinct action names in this dataset, for filtering
          items: { type: string }

    AuditChainVerification:
      type: object
      required: [valid, checked, brokenAtId, checkedAt]
      properties:
        valid: { type: boolean }
        checked: { type: integer }
        brokenAtId: { type: ["integer", "null"] }
        checkedAt:
          type: string
          format: date-time

    DeleteKind:
      type: string
      enum: [bank, product, document, rulebook, rulebook_version, assessment]

    DeleteImpact:
      type: object
      required: [kind, id, name, products, documents, assessments, rulebookVersions, rules, notices, removesActiveRulebook, blockedReason]
      properties:
        kind: { $ref: "#/components/schemas/DeleteKind" }
        id: { type: integer }
        name: { type: string }
        products: { type: integer }
        documents: { type: integer }
        assessments: { type: integer }
        rulebookVersions: { type: integer }
        rules: { type: integer }
        notices: { type: integer }
        removesActiveRulebook: { type: boolean }
        blockedReason: { type: string, nullable: true }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Plain explanation of what went wrong and what to do }

    DuplicateFileError:
      type: object
      required: [error, existingId]
      properties:
        error: { type: string }
        existingId: { type: integer }

    FileUploadInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    Product:
      type: object
      required: [id, bankId, name, cardTier, isIslamic, absentRoles, documentCount]
      properties:
        id: { type: integer }
        bankId: { type: integer }
        name: { type: string }
        cardTier: { type: ["string", "null"] }
        isIslamic: { type: boolean }
        absentRoles:
          type: array
          description: Document roles the card does not have by design (rules that only run on them are Not applicable)
          items: { $ref: "#/components/schemas/DocRole" }
        documentCount: { type: integer }

    Bank:
      type: object
      required: [id, nameEn, nameAr, logoUrl, products, documentCount]
      properties:
        id: { type: integer }
        nameEn: { type: string }
        nameAr: { type: ["string", "null"] }
        logoUrl:
          type: ["string", "null"]
          description: Official logo, as a path relative to the web app (e.g. banks/adcb.svg). Null when the bank is not in the logo catalogue.
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        documentCount: { type: integer }

    BankList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Bank" }

    BankInput:
      type: object
      required: [nameEn]
      properties:
        nameEn: { type: string, minLength: 2, maxLength: 120 }
        nameAr: { type: ["string", "null"], maxLength: 120 }

    ProductInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        cardTier: { type: ["string", "null"], maxLength: 60 }

    DocType:
      type: string
      enum: [kfs, tnc, rewards, fees, advert]
      description: kfs = Key Facts Statement, tnc = Terms and Conditions, rewards = Rewards terms, fees = Fees Schedule, advert = Advertisement or marketing material

    DocLanguage:
      type: string
      enum: [en, ar]

    DocumentStatus:
      type: string
      enum: [uploaded, proposed, confirmed, rejected]
      description: proposed = the tool suggested details that await confirmation

    Severity:
      type: string
      enum: [low, medium, high]

    CheckType:
      type: string
      enum: [presence, max_value, min_value, cross_document, bilingual, readability, prohibited_language, binary, subjective, calculation]

    RuleField:
      type: string
      enum: [code, title, text, category, appliesTo, checkType, threshold, severity]

    SuggestionItem:
      type: object
      required: [value, reason]
      properties:
        value: { type: ["string", "integer", "null"] }
        reason: { type: string, description: Plain explanation of how the tool arrived at the suggestion }

    DocumentSuggestion:
      type: object
      required: [docType, language, bankId, productId, source]
      description: Rule-based suggestions from the file itself. The examiner confirms or corrects them.
      properties:
        docType: { $ref: "#/components/schemas/SuggestionItem" }
        language: { $ref: "#/components/schemas/SuggestionItem" }
        bankId: { $ref: "#/components/schemas/SuggestionItem" }
        productId: { $ref: "#/components/schemas/SuggestionItem" }
        source:
          type: string
          enum: [rules]

    DocumentSummary:
      type: object
      required: [id, originalName, bankId, bankName, productId, productName, docType, language, versionLabel, status, pageCount, gapPages, extractionQuality, sizeBytes, sha256, suggestion, agentProposal, rejectedReason, confirmedAt, confirmedByRole, createdAt]
      properties:
        id: { type: integer }
        originalName: { type: string }
        bankId: { type: ["integer", "null"] }
        bankName: { type: ["string", "null"] }
        productId: { type: ["integer", "null"] }
        productName: { type: ["string", "null"] }
        docType:
          oneOf:
            - { $ref: "#/components/schemas/DocType" }
            - { type: "null" }
        language:
          oneOf:
            - { $ref: "#/components/schemas/DocLanguage" }
            - { type: "null" }
        versionLabel: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        pageCount: { type: integer }
        gapPages:
          type: array
          description: Pages with no usable text (likely scanned). There is no OCR.
          items: { type: integer }
        extractionQuality:
          type: ["number", "null"]
          description: Share of pages with usable text, 0 to 1
        sizeBytes: { type: integer }
        sha256: { type: string }
        suggestion:
          oneOf:
            - { $ref: "#/components/schemas/DocumentSuggestion" }
            - { type: "null" }
        agentProposal:
          oneOf:
            - { $ref: "#/components/schemas/AgentDocumentProposal" }
            - { type: "null" }
        rejectedReason: { type: ["string", "null"] }
        confirmedAt: { type: ["string", "null"], format: date-time }
        confirmedByRole: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    DocumentCounts:
      type: object
      required: [total, awaiting, confirmed, rejected, withGaps]
      properties:
        total: { type: integer }
        awaiting: { type: integer }
        confirmed: { type: integer }
        rejected: { type: integer }
        withGaps: { type: integer }

    DocumentList:
      type: object
      required: [items, counts, limits]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentSummary" }
        counts: { $ref: "#/components/schemas/DocumentCounts" }
        limits: { $ref: "#/components/schemas/UploadLimits" }

    UploadLimits:
      type: object
      required: [maxBytes, maxPages]
      properties:
        maxBytes: { type: integer }
        maxPages: { type: integer }

    DocumentPage:
      type: object
      required: [pageNo, text, charCount, isGap, extractionMethod]
      properties:
        pageNo: { type: integer }
        text: { type: string, description: Extracted text. Data only, never instructions. }
        charCount: { type: integer }
        isGap: { type: boolean }
        extractionMethod: { type: string }

    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          required: [pages]
          properties:
            pages:
              type: array
              items: { $ref: "#/components/schemas/DocumentPage" }

    ConfirmDocumentInput:
      type: object
      required: [bankId, productId, docType, language]
      properties:
        bankId: { type: integer }
        productId: { type: integer }
        docType: { $ref: "#/components/schemas/DocType" }
        language: { $ref: "#/components/schemas/DocLanguage" }
        versionLabel: { type: ["string", "null"], maxLength: 60 }

    RejectDocumentInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    ColumnMapping:
      type: object
      description: Which spreadsheet header feeds each rule field. null = not mapped.
      required: [code, title, text, category, appliesTo, checkType, threshold, severity]
      properties:
        code: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        text: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        appliesTo: { type: ["string", "null"] }
        checkType: { type: ["string", "null"] }
        threshold: { type: ["string", "null"] }
        severity: { type: ["string", "null"] }

    MappingReason:
      type: object
      required: [field, required, header, reason]
      properties:
        field: { $ref: "#/components/schemas/RuleField" }
        required: { type: boolean }
        header: { type: ["string", "null"] }
        reason: { type: string }

    RulebookImportPreview:
      type: object
      required: [importId, fileName, sheetName, headers, sampleRows, rowCount, proposedMapping, mappingReasons]
      properties:
        importId: { type: integer }
        fileName: { type: string }
        sheetName: { type: string }
        headers:
          type: array
          items: { type: string }
        sampleRows:
          type: array
          items:
            type: array
            items: { type: string }
        rowCount: { type: integer }
        proposedMapping: { $ref: "#/components/schemas/ColumnMapping" }
        mappingReasons:
          type: array
          items: { $ref: "#/components/schemas/MappingReason" }

    RulebookImportInput:
      type: object
      required: [importId, mapping, dryRun]
      properties:
        importId: { type: integer }
        mapping: { $ref: "#/components/schemas/ColumnMapping" }
        dryRun: { type: boolean }
        rulebookId: { type: ["integer", "null"], description: Add a version to this rulebook; null creates a new rulebook }
        rulebookName: { type: ["string", "null"], maxLength: 120 }

    Threshold:
      type: object
      required: [value, unit, raw]
      properties:
        value: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        raw: { type: string }

    RuleDraft:
      type: object
      required: [row, code, title, text, category, appliesToDocTypes, checkType, threshold, severity, details]
      properties:
        row: { type: integer }
        code: { type: string }
        title: { type: string }
        text: { type: string }
        category: { type: ["string", "null"] }
        appliesToDocTypes:
          type: array
          items: { $ref: "#/components/schemas/DocType" }
        checkType: { $ref: "#/components/schemas/CheckType" }
        threshold:
          oneOf:
            - { $ref: "#/components/schemas/Threshold" }
            - { type: "null" }
        severity: { $ref: "#/components/schemas/Severity" }
        details:
          type: array
          description: Extra spreadsheet columns kept with the rule (for example evidence to look for, pass criteria, examples)
          items: { $ref: "#/components/schemas/RuleDetail" }

    RuleDetail:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }

    RowError:
      type: object
      required: [row, field, message]
      properties:
        row: { type: integer, description: Spreadsheet row number (header is row 1) }
        field: { $ref: "#/components/schemas/RuleField" }
        message: { type: string }

    RulebookImportResult:
      type: object
      required: [dryRun, valid, rules, rowErrors, versionId, rulebookId, version]
      properties:
        dryRun: { type: boolean }
        valid: { type: boolean }
        rules:
          type: array
          items: { $ref: "#/components/schemas/RuleDraft" }
        rowErrors:
          type: array
          items: { $ref: "#/components/schemas/RowError" }
        versionId: { type: ["integer", "null"] }
        rulebookId: { type: ["integer", "null"] }
        version: { type: ["integer", "null"] }

    RulebookVersionStatus:
      type: string
      enum: [draft, active, retired]

    RulebookVersionSummary:
      type: object
      required: [id, rulebookId, version, status, ruleCount, sourceFileName, createdAt, activatedAt]
      properties:
        id: { type: integer }
        rulebookId: { type: integer }
        version: { type: integer }
        status: { $ref: "#/components/schemas/RulebookVersionStatus" }
        ruleCount: { type: integer }
        sourceFileName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: ["string", "null"], format: date-time }

    Rulebook:
      type: object
      required: [id, name, versions]
      properties:
        id: { type: integer }
        name: { type: string }
        versions:
          type: array
          items: { $ref: "#/components/schemas/RulebookVersionSummary" }

    RulebookList:
      type: object
      required: [items, activeVersionId]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Rulebook" }
        activeVersionId:
          type: ["integer", "null"]
          description: The single version assessments use, across all rulebooks

    Rule:
      type: object
      required: [id, code, title, text, category, appliesToDocTypes, checkType, threshold, severity, details]
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        text: { type: string }
        category: { type: ["string", "null"] }
        appliesToDocTypes:
          type: array
          items: { $ref: "#/components/schemas/DocType" }
        checkType: { $ref: "#/components/schemas/CheckType" }
        threshold:
          oneOf:
            - { $ref: "#/components/schemas/Threshold" }
            - { type: "null" }
        severity: { $ref: "#/components/schemas/Severity" }
        details:
          type: array
          description: Extra spreadsheet columns kept with the rule (for example evidence to look for, pass criteria, examples)
          items: { $ref: "#/components/schemas/RuleDetail" }

    RulebookVersionDetail:
      allOf:
        - $ref: "#/components/schemas/RulebookVersionSummary"
        - type: object
          required: [rulebookName, columnMapping, rules]
          properties:
            rulebookName: { type: string }
            columnMapping:
              oneOf:
                - { $ref: "#/components/schemas/ColumnMapping" }
                - { type: "null" }
            rules:
              type: array
              items: { $ref: "#/components/schemas/Rule" }

    FindingStatus:
      type: string
      enum: [compliant, breach, warning, needs_review, not_applicable]

    AssessmentStatus:
      type: string
      enum: [queued, running, complete, stopped, failed]
      description: stopped = ended early by a limit or by the examiner; failed = an error ended the run (no results are invented)

    AgentName:
      type: string
      enum: [coordinator, evidence, consistency, rule, challenger, code]
      description: code = a deterministic check, not a model call. coordinator and consistency appear only on older runs.

    StatusCounts:
      type: object
      required: [compliant, breach, warning, needs_review, not_applicable]
      properties:
        compliant: { type: integer }
        breach: { type: integer }
        warning: { type: integer }
        needs_review: { type: integer }
        not_applicable: { type: integer }

    AssessmentSummary:
      type: object
      required: [id, bankId, bankName, productId, productName, rulebookVersionId, rulebookVersion, kind, status, stopReason, progress, stepsUsed, stepLimit, tokensIn, tokensOut, tokenLimit, model, startedAt, finishedAt, createdAt, counts]
      properties:
        id: { type: integer }
        bankId: { type: ["integer", "null"] }
        bankName: { type: ["string", "null"] }
        productId: { type: ["integer", "null"] }
        productName: { type: ["string", "null"] }
        rulebookVersionId: { type: ["integer", "null"] }
        rulebookVersion: { type: ["integer", "null"] }
        kind: { type: string, enum: [agentic, baseline] }
        status: { $ref: "#/components/schemas/AssessmentStatus" }
        stopReason: { type: ["string", "null"], description: Plain reason the run ended }
        progress: { type: ["string", "null"], description: What the run is doing now (while running) }
        stepsUsed: { type: integer }
        stepLimit: { type: integer }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        tokenLimit: { type: integer, description: Limit on input plus output tokens for the whole run }
        model: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"], format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        counts: { $ref: "#/components/schemas/StatusCounts" }

    AssessmentList:
      type: object
      required: [items, runningId]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssessmentSummary" }
        runningId: { type: ["integer", "null"] }

    StartAssessmentInput:
      type: object
      required: [productId]
      properties:
        productId: { type: integer }

    CandidateDocument:
      type: object
      required: [id, originalName, docType, language, gapPages]
      properties:
        id: { type: integer }
        originalName: { type: string }
        docType: { $ref: "#/components/schemas/DocType" }
        language: { $ref: "#/components/schemas/DocLanguage" }
        gapPages:
          type: array
          items: { type: integer }

    AssessmentCandidate:
      type: object
      required: [bankId, bankName, productId, productName, documents, missingDocTypes, awaitingCount, ready, notReadyReason, lastAssessment]
      properties:
        bankId: { type: integer }
        bankName: { type: string }
        productId: { type: integer }
        productName: { type: string }
        documents:
          type: array
          description: Confirmed documents that will be assessed
          items: { $ref: "#/components/schemas/CandidateDocument" }
        missingDocTypes:
          type: array
          description: Document types with no confirmed English document; rules for them become Needs review
          items: { $ref: "#/components/schemas/DocType" }
        awaitingCount: { type: integer, description: Documents for this product still awaiting confirmation (not included) }
        ready: { type: boolean }
        notReadyReason: { type: ["string", "null"] }
        lastAssessment:
          oneOf:
            - { $ref: "#/components/schemas/AssessmentSummary" }
            - { type: "null" }

    AssessmentCandidates:
      type: object
      required: [items, activeRulebookVersionId, activeRuleCount, llmConfigured, llmMessage, runningId, limits]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssessmentCandidate" }
        activeRulebookVersionId: { type: ["integer", "null"] }
        activeRuleCount: { type: integer }
        llmConfigured: { type: boolean }
        llmMessage: { type: string }
        runningId: { type: ["integer", "null"] }
        limits:
          type: object
          required: [stepLimit, tokenLimit]
          properties:
            stepLimit: { type: integer }
            tokenLimit: { type: integer }

    AgentStep:
      type: object
      required: [id, agent, stepNo, tool, summary, tokensIn, tokensOut, latencyMs, error, createdAt]
      properties:
        id: { type: integer }
        agent: { $ref: "#/components/schemas/AgentName" }
        stepNo: { type: integer }
        tool: { type: ["string", "null"] }
        summary: { type: string, description: One plain sentence on what this step did }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        latencyMs: { type: ["integer", "null"] }
        error: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    EvidenceVerification:
      type: string
      enum: [exact, normalized, not_found]
      description: exact = quote found verbatim on the cited page; normalized = found after whitespace/case normalisation; not_found = not on that page (finding becomes Warning)

    Evidence:
      type: object
      required: [id, documentId, documentName, docType, language, pageNo, quote, verified]
      properties:
        id: { type: integer }
        documentId: { type: integer }
        documentName: { type: string }
        docType: { oneOf: [{ $ref: "#/components/schemas/DocType" }, { type: "null" }] }
        language: { oneOf: [{ $ref: "#/components/schemas/DocLanguage" }, { type: "null" }] }
        pageNo: { type: integer }
        quote: { type: string, description: The bank's words, as cited }
        verified: { $ref: "#/components/schemas/EvidenceVerification" }

    CodeCheck:
      type: object
      required: [label, result, detail]
      description: A deterministic check run by code, not by the model
      properties:
        label: { type: string }
        result: { type: string, enum: [pass, fail, info] }
        detail: { type: string }

    Finding:
      type: object
      required: [id, ruleId, ruleCode, ruleTitle, ruleText, checkType, threshold, proposedStatus, severity, rationale, verification, proposedBy, evidence, checks]
      properties:
        id: { type: integer }
        ruleId: { type: ["integer", "null"] }
        ruleCode: { type: string }
        ruleTitle: { type: string }
        ruleText: { type: string }
        checkType: { $ref: "#/components/schemas/CheckType" }
        threshold:
          oneOf:
            - { $ref: "#/components/schemas/Threshold" }
            - { type: "null" }
        proposedStatus: { $ref: "#/components/schemas/FindingStatus" }
        severity: { $ref: "#/components/schemas/Severity" }
        rationale: { type: string, description: The tool's plain explanation }
        verification: { type: string, enum: [verified, unsupported] }
        proposedBy: { type: string, description: Which agent or check produced the proposal }
        verdict:
          type: ["string", "null"]
          enum: [satisfied, partially, not_satisfied, not_applicable, null]
          description: Rubric verdict after code checks (null when there is none)
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/CodeCheck" }
        challenger:
          oneOf:
            - { $ref: "#/components/schemas/ChallengerReview" }
            - { type: "null" }

    ChallengerVerdict:
      type: string
      enum: [supports, does_not_support, unclear]

    ChallengerReview:
      type: object
      required: [verdict, note, reason, downgraded]
      properties:
        verdict: { $ref: "#/components/schemas/ChallengerVerdict" }
        note: { type: string, description: One sentence from the Challenger agent }
        reason: { type: string, enum: [breach, low_confidence, difference], description: Why the Challenger was asked }
        downgraded: { type: boolean, description: True when the Challenger's view moved the proposal to Needs review }

    AssessmentAlert:
      type: object
      required: [kind, message, documentId, documentName, pageNo, quote]
      properties:
        kind: { type: string, enum: [injection, extraction_gap, missing_document, model_error] }
        message: { type: string }
        documentId: { type: ["integer", "null"] }
        documentName: { type: ["string", "null"] }
        pageNo: { type: ["integer", "null"] }
        quote: { type: ["string", "null"] }

    AssessmentDetail:
      allOf:
        - $ref: "#/components/schemas/AssessmentSummary"
        - type: object
          required: [documents, steps, findings, alerts]
          properties:
            documents:
              type: array
              items: { $ref: "#/components/schemas/CandidateDocument" }
            steps:
              type: array
              items: { $ref: "#/components/schemas/AgentStep" }
            findings:
              type: array
              items: { $ref: "#/components/schemas/Finding" }
            alerts:
              type: array
              items: { $ref: "#/components/schemas/AssessmentAlert" }

    Agreement:
      type: string
      enum: [agrees, differs, only_agent, only_rules, neither]
      description: How the agent's value compares with the rule-based suggestion from the file itself

    AgentQuote:
      type: object
      required: [page, quote, verified]
      properties:
        page: { type: integer }
        quote: { type: string }
        verified: { type: boolean, description: Found by code on the cited page }

    AgentField:
      type: object
      required: [value, reason, quote, agreement]
      properties:
        value: { type: ["string", "integer", "null"] }
        reason: { type: string }
        quote:
          oneOf:
            - { $ref: "#/components/schemas/AgentQuote" }
            - { type: "null" }
        agreement: { $ref: "#/components/schemas/Agreement" }

    AgentDocumentProposal:
      type: object
      description: The Ingestion agent's proposal, checked by code. The examiner confirms or corrects it.
      required: [status, error, model, tokensIn, tokensOut, latencyMs, requestedAt, finishedAt, docType, language, bankId, productId]
      properties:
        status: { type: string, enum: [running, done, failed] }
        error: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        latencyMs: { type: ["integer", "null"] }
        requestedAt: { type: string, format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        docType: { oneOf: [{ $ref: "#/components/schemas/AgentField" }, { type: "null" }] }
        language: { oneOf: [{ $ref: "#/components/schemas/AgentField" }, { type: "null" }] }
        bankId: { oneOf: [{ $ref: "#/components/schemas/AgentField" }, { type: "null" }] }
        productId: { oneOf: [{ $ref: "#/components/schemas/AgentField" }, { type: "null" }] }

    AgentMappingReason:
      type: object
      required: [field, required, header, reason, agreement]
      properties:
        field: { $ref: "#/components/schemas/RuleField" }
        required: { type: boolean }
        header: { type: ["string", "null"] }
        reason: { type: string }
        agreement: { $ref: "#/components/schemas/Agreement" }

    AgentMappingProposal:
      type: object
      required: [mapping, reasons, model, tokensIn, tokensOut, latencyMs]
      properties:
        mapping: { $ref: "#/components/schemas/ColumnMapping" }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/AgentMappingReason" }
        model: { type: string }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        latencyMs: { type: integer }

    DecisionKind:
      type: string
      enum: [accept, reject, modify]
      description: accept = the proposed status stands; modify = the examiner sets a different status; reject = the proposal is dismissed and no finding stands

    ApprovalStatus:
      type: string
      enum: [not_required, awaiting, approved, returned]
      description: not_required = a routine Compliant or Not applicable accept, final at once; awaiting = a senior examiner must approve; returned = sent back to the maker with a note

    Decision:
      type: object
      required: [id, decision, finalStatus, examinerNote, role, actor, decidedAt, approvalStatus, makerIsYou, checker, checkerNote, checkedAt, selfApproved]
      properties:
        selfApproved: { type: boolean, description: True when the maker also checked it (PoC maker-checker mode only) }
        approvalStatus: { $ref: "#/components/schemas/ApprovalStatus" }
        makerIsYou: { type: boolean, description: True when the signed-in person recorded this decision (they cannot approve it) }
        checker: { type: ["string", "null"], description: Senior examiner who approved or returned it }
        checkerNote: { type: ["string", "null"] }
        checkedAt: { type: ["string", "null"], format: date-time }
        id: { type: integer }
        decision: { $ref: "#/components/schemas/DecisionKind" }
        finalStatus:
          oneOf:
            - { $ref: "#/components/schemas/FindingStatus" }
            - { type: "null" }
        examinerNote: { type: ["string", "null"] }
        role: { type: string }
        actor: { type: ["string", "null"] }
        decidedAt: { type: string, format: date-time }

    DecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/DecisionKind" }
        finalStatus:
          oneOf:
            - { $ref: "#/components/schemas/FindingStatus" }
            - { type: "null" }
        examinerNote: { type: ["string", "null"], maxLength: 2000 }

    NoticeState:
      type: string
      enum: [draft, awaiting, approved, returned]

    NoticeCreateInput:
      type: object
      required: [assessmentId]
      properties:
        assessmentId: { type: integer }
        referenceDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }

    NoticeFindingUpdate:
      type: object
      required: [findingId]
      properties:
        findingId: { type: integer }
        action: { type: string, maxLength: 4000 }
        dueDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        included: { type: boolean }

    NoticeUpdateInput:
      type: object
      properties:
        body: { type: string, maxLength: 20000 }
        referenceDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/NoticeFindingUpdate" }

    NoticeEvidence:
      type: object
      required: [documentName, docType, pageNo, quote, verified]
      properties:
        documentName: { type: string }
        docType: { type: ["string", "null"] }
        pageNo: { type: integer }
        quote: { type: string }
        verified: { type: boolean }

    NoticeFinding:
      type: object
      required: [findingId, ruleCode, ruleTitle, ruleText, sourceRef, theme, status, severity, rationale, examinerNote, decidedBy, approvedBy, selfApproved, evidence, action, dueDate, included, stillEligible]
      properties:
        findingId: { type: integer }
        ruleCode: { type: string }
        ruleTitle: { type: string }
        ruleText: { type: string }
        sourceRef: { type: ["string", "null"] }
        theme: { type: string }
        status: { type: string, enum: [breach, warning] }
        severity: { type: string, enum: [high, medium, low] }
        rationale: { type: string }
        examinerNote: { type: ["string", "null"] }
        decidedBy: { type: ["string", "null"] }
        approvedBy: { type: ["string", "null"] }
        selfApproved: { type: boolean, description: True when the decision was approved by its maker (PoC maker-checker mode only) }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/NoticeEvidence" }
        action: { type: string }
        dueDate: { type: ["string", "null"] }
        included: { type: boolean }
        stillEligible: { type: boolean }

    NoticeTheme:
      type: object
      required: [theme, rating, label, breaches, warnings, complaints, peerMedian]
      properties:
        theme: { type: string }
        rating: { type: ["integer", "null"] }
        label: { type: ["string", "null"] }
        breaches: { type: integer }
        warnings: { type: integer }
        complaints: { type: ["integer", "null"] }
        peerMedian: { type: ["number", "null"] }

    NoticeStep:
      type: object
      required: [action, actor, note, at, selfApproved]
      properties:
        selfApproved: { type: boolean, description: True on an approve or return step by the person who sent it (PoC maker-checker mode only) }
        action: { type: string, enum: [submit, approve, return] }
        actor: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        at: { type: string, format: date-time }

    Notice:
      type: object
      required: [id, assessmentId, productName, bankName, state, referenceDate, responseDueDate, responseDays, body, overall, themes, findings, newlyEligible, outdated, newer, history, submittedBy, submittedByYou, checker, checkerNote, checkedAt, selfApproved, canEdit, canSubmit, canApprove, createdAt, updatedAt]
      properties:
        id: { type: integer }
        assessmentId: { type: ["integer", "null"] }
        productName: { type: string }
        bankName: { type: string }
        state: { $ref: "#/components/schemas/NoticeState" }
        referenceDate: { type: ["string", "null"] }
        responseDueDate: { type: ["string", "null"] }
        responseDays: { type: integer }
        body: { type: string }
        overall:
          type: object
          required: [rating, label, provisional]
          properties:
            rating: { type: ["integer", "null"] }
            label: { type: ["string", "null"] }
            provisional: { type: boolean }
        themes:
          type: array
          items: { $ref: "#/components/schemas/NoticeTheme" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/NoticeFinding" }
        newlyEligible: { type: integer }
        outdated:
          type: boolean
          description: True when a later finished assessment of the same card replaced this report's assessment.
        newer:
          description: The assessment that replaced this report's one, when outdated.
          oneOf:
            - $ref: "#/components/schemas/NoticeNewerAssessment"
            - type: "null"
        history:
          type: array
          items: { $ref: "#/components/schemas/NoticeStep" }
        submittedBy: { type: ["string", "null"] }
        submittedByYou: { type: boolean }
        checker: { type: ["string", "null"] }
        checkerNote: { type: ["string", "null"] }
        checkedAt: { type: ["string", "null"], format: date-time }
        selfApproved: { type: boolean, description: True when the latest approval was by the person who sent it (PoC maker-checker mode only) }
        canEdit: { type: boolean }
        canSubmit: { type: boolean }
        canApprove: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NoticeNewerAssessment:
      type: object
      required: [assessmentId, noticeId, approvedFindings]
      properties:
        assessmentId: { type: integer }
        noticeId:
          type: ["integer", "null"]
          description: The report already drafted for the newer assessment, if any.
        approvedFindings:
          type: integer
          description: Approved breaches and warnings on the newer assessment; 0 means a report cannot be drafted yet.

    NoticeReadyCard:
      type: object
      required: [assessmentId, productName, bankName, breaches, warnings, noticeId]
      properties:
        assessmentId: { type: integer }
        productName: { type: string }
        bankName: { type: string }
        breaches: { type: integer }
        warnings: { type: integer }
        noticeId: { type: ["integer", "null"] }

    NoticeSummary:
      type: object
      required: [id, assessmentId, productName, bankName, state, findings, responseDueDate, updatedAt, outdated]
      properties:
        id: { type: integer }
        assessmentId: { type: ["integer", "null"] }
        productName: { type: string }
        bankName: { type: string }
        state: { $ref: "#/components/schemas/NoticeState" }
        findings: { type: integer }
        responseDueDate: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }
        outdated: { type: boolean }

    NoticeList:
      type: object
      required: [ready, notices]
      properties:
        ready:
          type: array
          items: { $ref: "#/components/schemas/NoticeReadyCard" }
        notices:
          type: array
          items: { $ref: "#/components/schemas/NoticeSummary" }

    ApprovalInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, return] }
        note: { type: ["string", "null"], maxLength: 2000 }

    ReviewItem:
      type: object
      required: [findingId, assessmentId, bankId, bankName, productId, productName, ruleCode, ruleTitle, proposedStatus, severity, verification, rationale, evidenceCount, decision, challengerVerdict]
      properties:
        challengerVerdict:
          oneOf:
            - { $ref: "#/components/schemas/ChallengerVerdict" }
            - { type: "null" }
        findingId: { type: integer }
        assessmentId: { type: integer }
        bankId: { type: ["integer", "null"] }
        bankName: { type: ["string", "null"] }
        productId: { type: ["integer", "null"] }
        productName: { type: ["string", "null"] }
        ruleCode: { type: string }
        ruleTitle: { type: string }
        proposedStatus: { $ref: "#/components/schemas/FindingStatus" }
        severity: { $ref: "#/components/schemas/Severity" }
        verification: { type: string, enum: [verified, unsupported] }
        rationale: { type: string }
        evidenceCount: { type: integer }
        decision:
          oneOf:
            - { $ref: "#/components/schemas/Decision" }
            - { type: "null" }

    ReviewProduct:
      type: object
      required: [productId, productName, bankName, assessmentId, finishedAt, total, undecided, bulkAcceptable]
      properties:
        productId: { type: ["integer", "null"] }
        productName: { type: ["string", "null"] }
        bankName: { type: ["string", "null"] }
        assessmentId: { type: integer }
        finishedAt: { type: ["string", "null"], format: date-time }
        total: { type: integer }
        undecided: { type: integer }
        bulkAcceptable: { type: integer, description: Undecided, quote-verified Compliant or Not applicable proposals }

    ReviewQueue:
      type: object
      required: [items, products, counts]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewItem" }
        products:
          type: array
          items: { $ref: "#/components/schemas/ReviewProduct" }
        counts:
          type: object
          required: [total, undecided, decided, accepted, modified, rejected, awaitingApproval, returned, disagreements]
          properties:
            awaitingApproval: { type: integer }
            returned: { type: integer }
            disagreements: { type: integer, description: Findings where the Challenger does not support the Rule agent }
            total: { type: integer }
            undecided: { type: integer }
            decided: { type: integer }
            accepted: { type: integer }
            modified: { type: integer }
            rejected: { type: integer }

    SourceHighlight:
      type: object
      required: [start, end, evidenceId]
      properties:
        start: { type: integer }
        end: { type: integer }
        evidenceId: { type: integer }

    SourcePage:
      type: object
      required: [documentId, documentName, docType, language, pageNo, text, isGap, highlights]
      properties:
        documentId: { type: integer }
        documentName: { type: string }
        docType: { oneOf: [{ $ref: "#/components/schemas/DocType" }, { type: "null" }] }
        language: { oneOf: [{ $ref: "#/components/schemas/DocLanguage" }, { type: "null" }] }
        pageNo: { type: integer }
        text: { type: string }
        isGap: { type: boolean }
        highlights:
          type: array
          items: { $ref: "#/components/schemas/SourceHighlight" }

    FindingDetail:
      allOf:
        - $ref: "#/components/schemas/Finding"
        - type: object
          required: [assessmentId, assessmentStatus, assessmentFinishedAt, model, bankName, productId, productName, isLatest, decision, history, sourcePages, prevId, nextId, nextUndecidedId]
          properties:
            assessmentId: { type: integer }
            assessmentStatus: { $ref: "#/components/schemas/AssessmentStatus" }
            assessmentFinishedAt: { type: ["string", "null"], format: date-time }
            model: { type: ["string", "null"] }
            bankName: { type: ["string", "null"] }
            productId: { type: ["integer", "null"] }
            productName: { type: ["string", "null"] }
            isLatest: { type: boolean, description: false when a newer assessment of the product exists; decisions are then closed }
            decision:
              oneOf:
                - { $ref: "#/components/schemas/Decision" }
                - { type: "null" }
            history:
              type: array
              description: Every decision on this finding, newest first
              items: { $ref: "#/components/schemas/Decision" }
            sourcePages:
              type: array
              items: { $ref: "#/components/schemas/SourcePage" }
            prevId: { type: ["integer", "null"], description: Previous finding in the review queue order }
            nextId: { type: ["integer", "null"] }
            nextUndecidedId: { type: ["integer", "null"], description: Next undecided finding after this one, wrapping around }

    BulkAcceptInput:
      type: object
      required: [assessmentId]
      properties:
        assessmentId: { type: integer }
        examinerNote: { type: ["string", "null"], maxLength: 2000 }

    BulkAcceptResult:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer }

    SettingsKind:
      type: string
      enum: [scoring, document_roles]

    ScoringSettings:
      type: object
      required: [kind, content, isDefault, updatedAt, updatedBy]
      properties:
        kind: { $ref: "#/components/schemas/SettingsKind" }
        content: { type: object, additionalProperties: true }
        isDefault: { type: boolean, description: True when no edited copy is saved and the loaded file is used }
        updatedAt: { type: ["string", "null"], format: date-time }
        updatedBy: { type: ["string", "null"] }

    ScoringSettingsInput:
      type: object
      required: [content]
      properties:
        content: { type: object, additionalProperties: true }

    ComplaintTheme:
      type: object
      required: [id, category, theme, knownTheme, complaintCount]
      properties:
        id: { type: integer }
        category: { type: string }
        theme: { type: string }
        knownTheme: { type: boolean, description: The theme is one of the scoring themes }
        complaintCount: { type: integer, description: Complaints recorded under this category }

    ComplaintThemeList:
      type: object
      required: [items, themes, unmappedCategories]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ComplaintTheme" }
        themes:
          type: array
          items: { type: string }
        unmappedCategories:
          type: array
          items: { type: string }

    ComplaintThemeInput:
      type: object
      required: [category, theme]
      properties:
        category: { type: string, minLength: 1, maxLength: 200 }
        theme: { type: string, minLength: 1, maxLength: 200 }

    Complaint:
      type: object
      required: [id, bankId, bankName, productId, productName, category, theme, count, period]
      properties:
        id: { type: integer }
        bankId: { type: integer }
        bankName: { type: string }
        productId: { type: ["integer", "null"] }
        productName: { type: ["string", "null"] }
        category: { type: string }
        theme: { type: ["string", "null"], description: From the category mapping; null when unmapped }
        count: { type: integer }
        period: { type: ["string", "null"] }

    ComplaintList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Complaint" }

    ComplaintInput:
      type: object
      required: [bankId, category, count]
      properties:
        bankId: { type: integer }
        productId: { type: ["integer", "null"] }
        category: { type: string, minLength: 1, maxLength: 200 }
        count: { type: integer, minimum: 0, maximum: 100000000 }
        period: { type: ["string", "null"], maxLength: 60 }

    ImportSummary:
      type: object
      required: [added, updated, skipped, errors]
      properties:
        added: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items: { type: string }

    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        cardTier: { type: ["string", "null"], maxLength: 60 }
        isIslamic: { type: boolean }
        absentRoles:
          type: array
          items: { $ref: "#/components/schemas/DocRole" }

    DocRole:
      type: string
      enum: [TC, REWARDS, KFS, SOFC, ADVERT]

    RuleUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        text: { type: string, minLength: 1, maxLength: 5000 }
        category: { type: ["string", "null"], maxLength: 200 }
        severity: { $ref: "#/components/schemas/Severity" }
        checkType: { $ref: "#/components/schemas/CheckType" }
        appliesToDocTypes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DocType" }
        details:
          type: array
          items: { $ref: "#/components/schemas/RuleDetail" }

    ScoreClass:
      type: string
      enum: [Satisfied, Partially, Not satisfied, Not applicable, Scored under, Not assessed, "Not assessed: document missing"]

    ScoredRule:
      type: object
      required: [ruleId, code, title, theme, severity, outcome, basis, contradiction, findingId, rating]
      properties:
        ruleId: { type: integer }
        code: { type: string }
        title: { type: string }
        theme: { type: ["string", "null"] }
        severity: { $ref: "#/components/schemas/Severity" }
        outcome: { $ref: "#/components/schemas/ScoreClass" }
        basis: { type: string }
        contradiction: { type: boolean }
        findingId: { type: ["integer", "null"] }
        rating: { type: ["integer", "null"] }

    ThemeComplaints:
      type: object
      required: [count, peerMedian, corroborated]
      properties:
        count: { type: integer }
        peerMedian: { type: ["number", "null"] }
        corroborated: { type: boolean }

    ThemeScore:
      type: object
      required: [theme, mean, rating, label, percentage, capped, nearCutoff, assessed, notApplicable, notAssessed, documentMissing, scoredUnder, rulesAt4, complaints]
      properties:
        theme: { type: string }
        mean: { type: ["number", "null"] }
        rating: { type: ["integer", "null"] }
        label: { type: ["string", "null"] }
        percentage: { type: ["number", "null"] }
        capped: { type: boolean }
        nearCutoff: { type: boolean }
        assessed: { type: integer }
        notApplicable: { type: integer }
        notAssessed: { type: integer }
        documentMissing: { type: integer }
        scoredUnder: { type: integer }
        rulesAt4: { type: integer }
        complaints:
          oneOf:
            - { $ref: "#/components/schemas/ThemeComplaints" }
            - { type: "null" }

    Scorecard:
      type: object
      required: [assessmentId, rating, label, mean, percentage, nearCutoff, capReasons, coverage, provisional, provisionalLabel, missingRoles, themes, rules, contradictions, configVersion, hasComplaintData]
      properties:
        assessmentId: { type: integer }
        rating: { type: ["integer", "null"] }
        label: { type: ["string", "null"] }
        mean: { type: ["number", "null"] }
        percentage: { type: ["number", "null"] }
        nearCutoff: { type: boolean }
        capReasons:
          type: array
          items: { type: string }
        coverage:
          type: object
          required: [assessed, notAssessed, documentMissing, ratio]
          properties:
            assessed: { type: integer }
            notAssessed: { type: integer }
            documentMissing: { type: integer }
            ratio: { type: ["number", "null"] }
        provisional: { type: boolean }
        provisionalLabel: { type: ["string", "null"] }
        missingRoles:
          type: array
          items: { type: string }
        themes:
          type: array
          items: { $ref: "#/components/schemas/ThemeScore" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/ScoredRule" }
        contradictions: { type: integer }
        configVersion: { type: string }
        hasComplaintData: { type: boolean }
