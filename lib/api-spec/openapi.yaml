openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Examiner Co-Pilot API. Agents propose, examiners decide.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Workspace mode (demo or live) and progress through the review steps
  - name: llm
    description: Language model provider status
  - name: audit
    description: Append-only audit log
  - name: library
    description: Banks, card products and the versioned rulebook
  - name: documents
    description: Uploaded disclosure PDFs and their extracted pages
  - name: assessments
    description: Agent runs that propose a status per rule, with evidence checked by code
  - name: review
    description: Examiner decisions on proposed findings (append-only)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /workspace/status:
    get:
      operationId: getWorkspaceStatus
      tags: [workspace]
      summary: Current workspace mode and dataset
      responses:
        "200":
          description: Workspace status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStatus"

  /workspace/progress:
    get:
      operationId: getWorkspaceProgress
      tags: [workspace]
      summary: Progress through the four review steps, with counts, for the active dataset
      responses:
        "200":
          description: Step progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceProgress"

  /llm/status:
    get:
      operationId: getLlmStatus
      tags: [llm]
      summary: Whether the model provider is configured (no call is made)
      responses:
        "200":
          description: Provider configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmStatus"

  /llm/test:
    post:
      operationId: testLlmConnection
      tags: [llm]
      summary: Make one minimal call to the provider to check the key and model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleContext"
      responses:
        "200":
          description: Result of the connection test (ok may be false with a clear error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmTestResult"

  /audit/events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Audit events for the active dataset, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: action
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Page of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"

  /audit/verify:
    get:
      operationId: verifyAuditChain
      tags: [audit]
      summary: Recompute the hash chain and report whether any event was altered
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditChainVerification"

  /audit/role-change:
    post:
      operationId: recordRoleChange
      tags: [audit]
      summary: Record that the self-selected (unverified) role changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChangeInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"

  /workspace/demo/load:
    post:
      operationId: loadDemoData
      tags: [workspace]
      summary: Load the fictional demo banks, rulebook and documents (demo mode only, once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleContext"
      responses:
        "201":
          description: Demo data loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoLoadResult"
        "403":
          description: Not allowed for this role or in live mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Demo data already loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /banks:
    get:
      operationId: listBanks
      tags: [library]
      summary: Banks with their card products, for the active dataset
      responses:
        "200":
          description: Banks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankList"
    post:
      operationId: createBank
      tags: [library]
      summary: Add a bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bank"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A bank with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /banks/{id}/products:
    post:
      operationId: createProduct
      tags: [library]
      summary: Add a card product to a bank
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bank not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This bank already has a product with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rulebooks:
    get:
      operationId: listRulebooks
      tags: [library]
      summary: Rulebooks and their versions
      responses:
        "200":
          description: Rulebooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookList"

  /rulebooks/import/preview:
    post:
      operationId: previewRulebookImport
      tags: [library]
      summary: Upload an .xlsx rulebook; returns headers, sample rows and a proposed column mapping
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookImportPreview"
        "400":
          description: Not a readable .xlsx file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rulebooks/import/commit:
    post:
      operationId: commitRulebookImport
      tags: [library]
      summary: Validate the mapped rows (dryRun) or create a new draft rulebook version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulebookImportInput"
      responses:
        "200":
          description: Validation or import result (valid may be false with row errors)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookImportResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rulebook-versions/{id}:
    get:
      operationId: getRulebookVersion
      tags: [library]
      summary: One rulebook version with its rules
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookVersionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rulebook-versions/{id}/activate:
    post:
      operationId: activateRulebookVersion
      tags: [library]
      summary: Make this version the one assessments use; the previously active version is retired
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleContext"
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookVersionSummary"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Version is retired or has no rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: Uploaded documents for the active dataset, newest first
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload one PDF disclosure; text is extracted page by page
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
        "400":
          description: Not a valid PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The same file is already uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateFileError"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: One document with its extracted pages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/{id}/confirm:
    post:
      operationId: confirmDocument
      tags: [documents]
      summary: Examiner confirms bank, product, document type and language
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmDocumentInput"
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/{id}/reject:
    post:
      operationId: rejectDocument
      tags: [documents]
      summary: Examiner excludes the document from assessment, with a reason
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDocumentInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /assessments/candidates:
    get:
      operationId: listAssessmentCandidates
      tags: [assessments]
      summary: Card products and whether each is ready to assess, plus run preconditions
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentCandidates"

  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: Assessments for the active dataset, newest first
      responses:
        "200":
          description: Assessments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentList"
    post:
      operationId: startAssessment
      tags: [assessments]
      summary: Start an assessment of one card product against the active rulebook version. Runs in the background.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAssessmentInput"
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSummary"
        "400":
          description: The product is not ready (no confirmed documents or no active rulebook)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot start assessments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another assessment is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The model provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: One assessment with its agent trace, findings and evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments/{id}/stop:
    post:
      operationId: stopAssessment
      tags: [assessments]
      summary: Ask a running assessment to stop after its current step
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleContext"
      responses:
        "200":
          description: Stop requested (or already finished)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSummary"
        "403":
          description: Viewer cannot stop assessments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /documents/{id}/agent-proposal:
    post:
      operationId: requestDocumentAgentProposal
      tags: [documents]
      summary: Ask the Ingestion agent to propose type, language, bank and product. Runs in the background; poll the document.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleContext"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The model provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rulebooks/import/{importId}/agent-mapping:
    post:
      operationId: requestRulebookAgentMapping
      tags: [library]
      summary: Ask the Ingestion agent to propose a column mapping for an uploaded rulebook. Code checks the proposal.
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleContext"
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMappingProposal"
        "403":
          description: Viewer cannot change data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The model provider failed or gave no usable answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The model provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /review/queue:
    get:
      operationId: getReviewQueue
      tags: [review]
      summary: Findings from the latest finished assessment of each product, with the latest examiner decision
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueue"

  /findings/{id}:
    get:
      operationId: getFinding
      tags: [review]
      summary: One finding with its evidence, the source pages, and the decision history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /findings/{id}/decisions:
    post:
      operationId: decideFinding
      tags: [review]
      summary: Record an examiner decision. Append-only; the latest decision wins.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingDetail"
        "400":
          description: Invalid decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot record decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The finding belongs to an older assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /review/accept-compliant:
    post:
      operationId: acceptCompliantFindings
      tags: [review]
      summary: Accept every undecided, quote-verified Compliant or Not applicable proposal of one assessment in one step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAcceptInput"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAcceptResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer cannot record decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The assessment is not the latest for its product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Dataset:
      type: string
      enum: [demo, live]

    Role:
      type: string
      enum: [examiner, senior_examiner, viewer]
      description: Self-selected and unverified. Never treated as authentication.

    WorkspaceStatus:
      type: object
      required: [mode, switchedAt, switchedByRole, oneWay]
      properties:
        mode:
          $ref: "#/components/schemas/Dataset"
        switchedAt:
          type: ["string", "null"]
          format: date-time
        switchedByRole:
          type: ["string", "null"]
        oneWay:
          type: boolean
          description: Always true. Live cannot switch back to demo.

    StepState:
      type: string
      enum: [not_started, in_progress, done]

    StepCount:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: integer }

    StepProgress:
      type: object
      required: [key, number, title, question, href, state, counts, summary]
      properties:
        key:
          type: string
          enum: [upload, assess, review, notices]
        number: { type: integer }
        title: { type: string }
        question: { type: string }
        href: { type: string }
        state:
          $ref: "#/components/schemas/StepState"
        counts:
          type: array
          items:
            $ref: "#/components/schemas/StepCount"
        summary:
          type: string
          description: One plain sentence describing where this step stands

    WorkspaceProgress:
      type: object
      required: [dataset, steps, nextStepKey, library]
      properties:
        dataset:
          $ref: "#/components/schemas/Dataset"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepProgress"
        nextStepKey:
          type: string
          enum: [upload, assess, review, notices]
        library:
          $ref: "#/components/schemas/LibraryCounts"

    LibraryCounts:
      type: object
      required: [banks, products, rulebookVersions, activeRules]
      properties:
        banks: { type: integer }
        products: { type: integer }
        rulebookVersions: { type: integer }
        activeRules: { type: integer }

    LlmStatus:
      type: object
      required: [configured, keyPresent, modelPresent, model, provider, message]
      properties:
        configured: { type: boolean }
        keyPresent: { type: boolean }
        modelPresent: { type: boolean }
        model: { type: ["string", "null"] }
        provider: { type: string }
        message:
          type: string
          description: Plain explanation of the current state, including what to do if not configured

    LlmTestResult:
      type: object
      required: [ok, model, latencyMs, error, checkedAt]
      properties:
        ok: { type: boolean }
        model: { type: ["string", "null"] }
        latencyMs: { type: ["integer", "null"] }
        error:
          type: ["string", "null"]
          description: Clear error when the key is missing or the provider fails
        checkedAt:
          type: string
          format: date-time

    RoleContext:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    RoleChangeInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        previousRole:
          type: ["string", "null"]

    AuditEvent:
      type: object
      required: [id, dataset, ts, role, action, entityType, entityId, summary, hash]
      properties:
        id: { type: integer }
        dataset:
          $ref: "#/components/schemas/Dataset"
        ts:
          type: string
          format: date-time
        role:
          type: ["string", "null"]
        action: { type: string }
        entityType: { type: string }
        entityId: { type: ["string", "null"] }
        summary: { type: string }
        before: {}
        after: {}
        hash: { type: string }

    AuditEventPage:
      type: object
      required: [items, total, actions]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        total: { type: integer }
        actions:
          type: array
          description: Distinct action names in this dataset, for filtering
          items: { type: string }

    AuditChainVerification:
      type: object
      required: [valid, checked, brokenAtId, checkedAt]
      properties:
        valid: { type: boolean }
        checked: { type: integer }
        brokenAtId: { type: ["integer", "null"] }
        checkedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Plain explanation of what went wrong and what to do }

    DuplicateFileError:
      type: object
      required: [error, existingId]
      properties:
        error: { type: string }
        existingId: { type: integer }

    FileUploadInput:
      type: object
      required: [file, role]
      properties:
        file:
          type: string
          format: binary
        role:
          $ref: "#/components/schemas/Role"

    DemoLoadResult:
      type: object
      required: [banks, products, rules, documents, message]
      properties:
        banks: { type: integer }
        products: { type: integer }
        rules: { type: integer }
        documents: { type: integer }
        message: { type: string }

    Product:
      type: object
      required: [id, bankId, name, cardTier, documentCount]
      properties:
        id: { type: integer }
        bankId: { type: integer }
        name: { type: string }
        cardTier: { type: ["string", "null"] }
        documentCount: { type: integer }

    Bank:
      type: object
      required: [id, nameEn, nameAr, products, documentCount]
      properties:
        id: { type: integer }
        nameEn: { type: string }
        nameAr: { type: ["string", "null"] }
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        documentCount: { type: integer }

    BankList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Bank" }

    BankInput:
      type: object
      required: [role, nameEn]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        nameEn: { type: string, minLength: 2, maxLength: 120 }
        nameAr: { type: ["string", "null"], maxLength: 120 }

    ProductInput:
      type: object
      required: [role, name]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        name: { type: string, minLength: 2, maxLength: 120 }
        cardTier: { type: ["string", "null"], maxLength: 60 }

    DocType:
      type: string
      enum: [kfs, tnc, rewards, fees]
      description: kfs = Key Facts Statement, tnc = Terms and Conditions, rewards = Rewards terms, fees = Fees Schedule

    DocLanguage:
      type: string
      enum: [en, ar]

    DocumentStatus:
      type: string
      enum: [uploaded, proposed, confirmed, rejected]
      description: proposed = the tool suggested details that await confirmation

    Severity:
      type: string
      enum: [low, medium, high]

    CheckType:
      type: string
      enum: [presence, max_value, min_value, cross_document, bilingual, readability, prohibited_language]

    RuleField:
      type: string
      enum: [code, title, text, category, appliesTo, checkType, threshold, severity]

    SuggestionItem:
      type: object
      required: [value, reason]
      properties:
        value: { type: ["string", "integer", "null"] }
        reason: { type: string, description: Plain explanation of how the tool arrived at the suggestion }

    DocumentSuggestion:
      type: object
      required: [docType, language, bankId, productId, source]
      description: Rule-based suggestions from the file itself. The examiner confirms or corrects them.
      properties:
        docType: { $ref: "#/components/schemas/SuggestionItem" }
        language: { $ref: "#/components/schemas/SuggestionItem" }
        bankId: { $ref: "#/components/schemas/SuggestionItem" }
        productId: { $ref: "#/components/schemas/SuggestionItem" }
        source:
          type: string
          enum: [rules]

    DocumentSummary:
      type: object
      required: [id, originalName, bankId, bankName, productId, productName, docType, language, versionLabel, status, pageCount, gapPages, extractionQuality, sizeBytes, sha256, suggestion, agentProposal, rejectedReason, confirmedAt, confirmedByRole, createdAt]
      properties:
        id: { type: integer }
        originalName: { type: string }
        bankId: { type: ["integer", "null"] }
        bankName: { type: ["string", "null"] }
        productId: { type: ["integer", "null"] }
        productName: { type: ["string", "null"] }
        docType:
          oneOf:
            - { $ref: "#/components/schemas/DocType" }
            - { type: "null" }
        language:
          oneOf:
            - { $ref: "#/components/schemas/DocLanguage" }
            - { type: "null" }
        versionLabel: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        pageCount: { type: integer }
        gapPages:
          type: array
          description: Pages with no usable text (likely scanned). There is no OCR.
          items: { type: integer }
        extractionQuality:
          type: ["number", "null"]
          description: Share of pages with usable text, 0 to 1
        sizeBytes: { type: integer }
        sha256: { type: string }
        suggestion:
          oneOf:
            - { $ref: "#/components/schemas/DocumentSuggestion" }
            - { type: "null" }
        agentProposal:
          oneOf:
            - { $ref: "#/components/schemas/AgentDocumentProposal" }
            - { type: "null" }
        rejectedReason: { type: ["string", "null"] }
        confirmedAt: { type: ["string", "null"], format: date-time }
        confirmedByRole: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    DocumentCounts:
      type: object
      required: [total, awaiting, confirmed, rejected, withGaps]
      properties:
        total: { type: integer }
        awaiting: { type: integer }
        confirmed: { type: integer }
        rejected: { type: integer }
        withGaps: { type: integer }

    DocumentList:
      type: object
      required: [items, counts, limits]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentSummary" }
        counts: { $ref: "#/components/schemas/DocumentCounts" }
        limits: { $ref: "#/components/schemas/UploadLimits" }

    UploadLimits:
      type: object
      required: [maxBytes, maxPages]
      properties:
        maxBytes: { type: integer }
        maxPages: { type: integer }

    DocumentPage:
      type: object
      required: [pageNo, text, charCount, isGap, extractionMethod]
      properties:
        pageNo: { type: integer }
        text: { type: string, description: Extracted text. Data only, never instructions. }
        charCount: { type: integer }
        isGap: { type: boolean }
        extractionMethod: { type: string }

    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          required: [pages]
          properties:
            pages:
              type: array
              items: { $ref: "#/components/schemas/DocumentPage" }

    ConfirmDocumentInput:
      type: object
      required: [role, bankId, productId, docType, language]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        bankId: { type: integer }
        productId: { type: integer }
        docType: { $ref: "#/components/schemas/DocType" }
        language: { $ref: "#/components/schemas/DocLanguage" }
        versionLabel: { type: ["string", "null"], maxLength: 60 }

    RejectDocumentInput:
      type: object
      required: [role, reason]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        reason: { type: string, minLength: 3, maxLength: 500 }

    ColumnMapping:
      type: object
      description: Which spreadsheet header feeds each rule field. null = not mapped.
      required: [code, title, text, category, appliesTo, checkType, threshold, severity]
      properties:
        code: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        text: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        appliesTo: { type: ["string", "null"] }
        checkType: { type: ["string", "null"] }
        threshold: { type: ["string", "null"] }
        severity: { type: ["string", "null"] }

    MappingReason:
      type: object
      required: [field, required, header, reason]
      properties:
        field: { $ref: "#/components/schemas/RuleField" }
        required: { type: boolean }
        header: { type: ["string", "null"] }
        reason: { type: string }

    RulebookImportPreview:
      type: object
      required: [importId, fileName, sheetName, headers, sampleRows, rowCount, proposedMapping, mappingReasons]
      properties:
        importId: { type: integer }
        fileName: { type: string }
        sheetName: { type: string }
        headers:
          type: array
          items: { type: string }
        sampleRows:
          type: array
          items:
            type: array
            items: { type: string }
        rowCount: { type: integer }
        proposedMapping: { $ref: "#/components/schemas/ColumnMapping" }
        mappingReasons:
          type: array
          items: { $ref: "#/components/schemas/MappingReason" }

    RulebookImportInput:
      type: object
      required: [role, importId, mapping, dryRun]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        importId: { type: integer }
        mapping: { $ref: "#/components/schemas/ColumnMapping" }
        dryRun: { type: boolean }
        rulebookId: { type: ["integer", "null"], description: Add a version to this rulebook; null creates a new rulebook }
        rulebookName: { type: ["string", "null"], maxLength: 120 }

    Threshold:
      type: object
      required: [value, unit, raw]
      properties:
        value: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        raw: { type: string }

    RuleDraft:
      type: object
      required: [row, code, title, text, category, appliesToDocTypes, checkType, threshold, severity]
      properties:
        row: { type: integer }
        code: { type: string }
        title: { type: string }
        text: { type: string }
        category: { type: ["string", "null"] }
        appliesToDocTypes:
          type: array
          items: { $ref: "#/components/schemas/DocType" }
        checkType: { $ref: "#/components/schemas/CheckType" }
        threshold:
          oneOf:
            - { $ref: "#/components/schemas/Threshold" }
            - { type: "null" }
        severity: { $ref: "#/components/schemas/Severity" }

    RowError:
      type: object
      required: [row, field, message]
      properties:
        row: { type: integer, description: Spreadsheet row number (header is row 1) }
        field: { $ref: "#/components/schemas/RuleField" }
        message: { type: string }

    RulebookImportResult:
      type: object
      required: [dryRun, valid, rules, rowErrors, versionId, rulebookId, version]
      properties:
        dryRun: { type: boolean }
        valid: { type: boolean }
        rules:
          type: array
          items: { $ref: "#/components/schemas/RuleDraft" }
        rowErrors:
          type: array
          items: { $ref: "#/components/schemas/RowError" }
        versionId: { type: ["integer", "null"] }
        rulebookId: { type: ["integer", "null"] }
        version: { type: ["integer", "null"] }

    RulebookVersionStatus:
      type: string
      enum: [draft, active, retired]

    RulebookVersionSummary:
      type: object
      required: [id, rulebookId, version, status, ruleCount, sourceFileName, createdAt, activatedAt]
      properties:
        id: { type: integer }
        rulebookId: { type: integer }
        version: { type: integer }
        status: { $ref: "#/components/schemas/RulebookVersionStatus" }
        ruleCount: { type: integer }
        sourceFileName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: ["string", "null"], format: date-time }

    Rulebook:
      type: object
      required: [id, name, versions]
      properties:
        id: { type: integer }
        name: { type: string }
        versions:
          type: array
          items: { $ref: "#/components/schemas/RulebookVersionSummary" }

    RulebookList:
      type: object
      required: [items, activeVersionId]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Rulebook" }
        activeVersionId:
          type: ["integer", "null"]
          description: The single version assessments use, across all rulebooks

    Rule:
      type: object
      required: [id, code, title, text, category, appliesToDocTypes, checkType, threshold, severity]
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        text: { type: string }
        category: { type: ["string", "null"] }
        appliesToDocTypes:
          type: array
          items: { $ref: "#/components/schemas/DocType" }
        checkType: { $ref: "#/components/schemas/CheckType" }
        threshold:
          oneOf:
            - { $ref: "#/components/schemas/Threshold" }
            - { type: "null" }
        severity: { $ref: "#/components/schemas/Severity" }

    RulebookVersionDetail:
      allOf:
        - $ref: "#/components/schemas/RulebookVersionSummary"
        - type: object
          required: [rulebookName, columnMapping, rules]
          properties:
            rulebookName: { type: string }
            columnMapping:
              oneOf:
                - { $ref: "#/components/schemas/ColumnMapping" }
                - { type: "null" }
            rules:
              type: array
              items: { $ref: "#/components/schemas/Rule" }

    FindingStatus:
      type: string
      enum: [compliant, breach, warning, needs_review, not_applicable]

    AssessmentStatus:
      type: string
      enum: [queued, running, complete, stopped, failed]
      description: stopped = ended early by a limit or by the examiner; failed = an error ended the run (no results are invented)

    AgentName:
      type: string
      enum: [coordinator, evidence, consistency, rule, code]
      description: code = a deterministic check, not a model call

    StatusCounts:
      type: object
      required: [compliant, breach, warning, needs_review, not_applicable]
      properties:
        compliant: { type: integer }
        breach: { type: integer }
        warning: { type: integer }
        needs_review: { type: integer }
        not_applicable: { type: integer }

    AssessmentSummary:
      type: object
      required: [id, bankId, bankName, productId, productName, rulebookVersionId, rulebookVersion, kind, status, stopReason, progress, stepsUsed, stepLimit, tokensIn, tokensOut, tokenLimit, model, startedAt, finishedAt, createdAt, counts]
      properties:
        id: { type: integer }
        bankId: { type: ["integer", "null"] }
        bankName: { type: ["string", "null"] }
        productId: { type: ["integer", "null"] }
        productName: { type: ["string", "null"] }
        rulebookVersionId: { type: ["integer", "null"] }
        rulebookVersion: { type: ["integer", "null"] }
        kind: { type: string, enum: [agentic, baseline] }
        status: { $ref: "#/components/schemas/AssessmentStatus" }
        stopReason: { type: ["string", "null"], description: Plain reason the run ended }
        progress: { type: ["string", "null"], description: What the run is doing now (while running) }
        stepsUsed: { type: integer }
        stepLimit: { type: integer }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        tokenLimit: { type: integer, description: Limit on input plus output tokens for the whole run }
        model: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"], format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        counts: { $ref: "#/components/schemas/StatusCounts" }

    AssessmentList:
      type: object
      required: [items, runningId]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssessmentSummary" }
        runningId: { type: ["integer", "null"] }

    StartAssessmentInput:
      type: object
      required: [role, productId]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        productId: { type: integer }

    CandidateDocument:
      type: object
      required: [id, originalName, docType, language, gapPages]
      properties:
        id: { type: integer }
        originalName: { type: string }
        docType: { $ref: "#/components/schemas/DocType" }
        language: { $ref: "#/components/schemas/DocLanguage" }
        gapPages:
          type: array
          items: { type: integer }

    AssessmentCandidate:
      type: object
      required: [bankId, bankName, productId, productName, documents, missingDocTypes, awaitingCount, ready, notReadyReason, lastAssessment]
      properties:
        bankId: { type: integer }
        bankName: { type: string }
        productId: { type: integer }
        productName: { type: string }
        documents:
          type: array
          description: Confirmed documents that will be assessed
          items: { $ref: "#/components/schemas/CandidateDocument" }
        missingDocTypes:
          type: array
          description: Document types with no confirmed English document; rules for them become Needs review
          items: { $ref: "#/components/schemas/DocType" }
        awaitingCount: { type: integer, description: Documents for this product still awaiting confirmation (not included) }
        ready: { type: boolean }
        notReadyReason: { type: ["string", "null"] }
        lastAssessment:
          oneOf:
            - { $ref: "#/components/schemas/AssessmentSummary" }
            - { type: "null" }

    AssessmentCandidates:
      type: object
      required: [items, activeRulebookVersionId, activeRuleCount, llmConfigured, llmMessage, runningId, limits]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssessmentCandidate" }
        activeRulebookVersionId: { type: ["integer", "null"] }
        activeRuleCount: { type: integer }
        llmConfigured: { type: boolean }
        llmMessage: { type: string }
        runningId: { type: ["integer", "null"] }
        limits:
          type: object
          required: [stepLimit, tokenLimit]
          properties:
            stepLimit: { type: integer }
            tokenLimit: { type: integer }

    AgentStep:
      type: object
      required: [id, agent, stepNo, tool, summary, tokensIn, tokensOut, latencyMs, error, createdAt]
      properties:
        id: { type: integer }
        agent: { $ref: "#/components/schemas/AgentName" }
        stepNo: { type: integer }
        tool: { type: ["string", "null"] }
        summary: { type: string, description: One plain sentence on what this step did }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        latencyMs: { type: ["integer", "null"] }
        error: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    EvidenceVerification:
      type: string
      enum: [exact, normalized, not_found]
      description: exact = quote found verbatim on the cited page; normalized = found after whitespace/case normalisation; not_found = not on that page (finding becomes Warning)

    Evidence:
      type: object
      required: [id, documentId, documentName, docType, language, pageNo, quote, verified]
      properties:
        id: { type: integer }
        documentId: { type: integer }
        documentName: { type: string }
        docType: { oneOf: [{ $ref: "#/components/schemas/DocType" }, { type: "null" }] }
        language: { oneOf: [{ $ref: "#/components/schemas/DocLanguage" }, { type: "null" }] }
        pageNo: { type: integer }
        quote: { type: string, description: The bank's words, as cited }
        verified: { $ref: "#/components/schemas/EvidenceVerification" }

    CodeCheck:
      type: object
      required: [label, result, detail]
      description: A deterministic check run by code, not by the model
      properties:
        label: { type: string }
        result: { type: string, enum: [pass, fail, info] }
        detail: { type: string }

    Finding:
      type: object
      required: [id, ruleId, ruleCode, ruleTitle, ruleText, checkType, threshold, proposedStatus, severity, rationale, verification, proposedBy, evidence, checks]
      properties:
        id: { type: integer }
        ruleId: { type: ["integer", "null"] }
        ruleCode: { type: string }
        ruleTitle: { type: string }
        ruleText: { type: string }
        checkType: { $ref: "#/components/schemas/CheckType" }
        threshold:
          oneOf:
            - { $ref: "#/components/schemas/Threshold" }
            - { type: "null" }
        proposedStatus: { $ref: "#/components/schemas/FindingStatus" }
        severity: { $ref: "#/components/schemas/Severity" }
        rationale: { type: string, description: The tool's plain explanation }
        verification: { type: string, enum: [verified, unsupported] }
        proposedBy: { type: string, description: Which agent or check produced the proposal }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/CodeCheck" }

    AssessmentAlert:
      type: object
      required: [kind, message, documentId, documentName, pageNo, quote]
      properties:
        kind: { type: string, enum: [injection, extraction_gap, missing_document, model_error] }
        message: { type: string }
        documentId: { type: ["integer", "null"] }
        documentName: { type: ["string", "null"] }
        pageNo: { type: ["integer", "null"] }
        quote: { type: ["string", "null"] }

    AssessmentDetail:
      allOf:
        - $ref: "#/components/schemas/AssessmentSummary"
        - type: object
          required: [documents, steps, findings, alerts]
          properties:
            documents:
              type: array
              items: { $ref: "#/components/schemas/CandidateDocument" }
            steps:
              type: array
              items: { $ref: "#/components/schemas/AgentStep" }
            findings:
              type: array
              items: { $ref: "#/components/schemas/Finding" }
            alerts:
              type: array
              items: { $ref: "#/components/schemas/AssessmentAlert" }

    Agreement:
      type: string
      enum: [agrees, differs, only_agent, only_rules, neither]
      description: How the agent's value compares with the rule-based suggestion from the file itself

    AgentQuote:
      type: object
      required: [page, quote, verified]
      properties:
        page: { type: integer }
        quote: { type: string }
        verified: { type: boolean, description: Found by code on the cited page }

    AgentField:
      type: object
      required: [value, reason, quote, agreement]
      properties:
        value: { type: ["string", "integer", "null"] }
        reason: { type: string }
        quote:
          oneOf:
            - { $ref: "#/components/schemas/AgentQuote" }
            - { type: "null" }
        agreement: { $ref: "#/components/schemas/Agreement" }

    AgentDocumentProposal:
      type: object
      description: The Ingestion agent's proposal, checked by code. The examiner confirms or corrects it.
      required: [status, error, model, tokensIn, tokensOut, latencyMs, requestedAt, finishedAt, docType, language, bankId, productId]
      properties:
        status: { type: string, enum: [running, done, failed] }
        error: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        latencyMs: { type: ["integer", "null"] }
        requestedAt: { type: string, format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        docType: { oneOf: [{ $ref: "#/components/schemas/AgentField" }, { type: "null" }] }
        language: { oneOf: [{ $ref: "#/components/schemas/AgentField" }, { type: "null" }] }
        bankId: { oneOf: [{ $ref: "#/components/schemas/AgentField" }, { type: "null" }] }
        productId: { oneOf: [{ $ref: "#/components/schemas/AgentField" }, { type: "null" }] }

    AgentMappingReason:
      type: object
      required: [field, required, header, reason, agreement]
      properties:
        field: { $ref: "#/components/schemas/RuleField" }
        required: { type: boolean }
        header: { type: ["string", "null"] }
        reason: { type: string }
        agreement: { $ref: "#/components/schemas/Agreement" }

    AgentMappingProposal:
      type: object
      required: [mapping, reasons, model, tokensIn, tokensOut, latencyMs]
      properties:
        mapping: { $ref: "#/components/schemas/ColumnMapping" }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/AgentMappingReason" }
        model: { type: string }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        latencyMs: { type: integer }

    DecisionKind:
      type: string
      enum: [accept, reject, modify]
      description: accept = the proposed status stands; modify = the examiner sets a different status; reject = the proposal is dismissed and no finding stands

    Decision:
      type: object
      required: [id, decision, finalStatus, examinerNote, role, decidedAt]
      properties:
        id: { type: integer }
        decision: { $ref: "#/components/schemas/DecisionKind" }
        finalStatus:
          oneOf:
            - { $ref: "#/components/schemas/FindingStatus" }
            - { type: "null" }
        examinerNote: { type: ["string", "null"] }
        role: { type: string }
        decidedAt: { type: string, format: date-time }

    DecisionInput:
      type: object
      required: [role, decision]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        decision: { $ref: "#/components/schemas/DecisionKind" }
        finalStatus:
          oneOf:
            - { $ref: "#/components/schemas/FindingStatus" }
            - { type: "null" }
        examinerNote: { type: ["string", "null"], maxLength: 2000 }

    ReviewItem:
      type: object
      required: [findingId, assessmentId, bankId, bankName, productId, productName, ruleCode, ruleTitle, proposedStatus, severity, verification, rationale, evidenceCount, decision]
      properties:
        findingId: { type: integer }
        assessmentId: { type: integer }
        bankId: { type: ["integer", "null"] }
        bankName: { type: ["string", "null"] }
        productId: { type: ["integer", "null"] }
        productName: { type: ["string", "null"] }
        ruleCode: { type: string }
        ruleTitle: { type: string }
        proposedStatus: { $ref: "#/components/schemas/FindingStatus" }
        severity: { $ref: "#/components/schemas/Severity" }
        verification: { type: string, enum: [verified, unsupported] }
        rationale: { type: string }
        evidenceCount: { type: integer }
        decision:
          oneOf:
            - { $ref: "#/components/schemas/Decision" }
            - { type: "null" }

    ReviewProduct:
      type: object
      required: [productId, productName, bankName, assessmentId, finishedAt, total, undecided, bulkAcceptable]
      properties:
        productId: { type: ["integer", "null"] }
        productName: { type: ["string", "null"] }
        bankName: { type: ["string", "null"] }
        assessmentId: { type: integer }
        finishedAt: { type: ["string", "null"], format: date-time }
        total: { type: integer }
        undecided: { type: integer }
        bulkAcceptable: { type: integer, description: Undecided, quote-verified Compliant or Not applicable proposals }

    ReviewQueue:
      type: object
      required: [items, products, counts]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewItem" }
        products:
          type: array
          items: { $ref: "#/components/schemas/ReviewProduct" }
        counts:
          type: object
          required: [total, undecided, decided, accepted, modified, rejected]
          properties:
            total: { type: integer }
            undecided: { type: integer }
            decided: { type: integer }
            accepted: { type: integer }
            modified: { type: integer }
            rejected: { type: integer }

    SourceHighlight:
      type: object
      required: [start, end, evidenceId]
      properties:
        start: { type: integer }
        end: { type: integer }
        evidenceId: { type: integer }

    SourcePage:
      type: object
      required: [documentId, documentName, docType, language, pageNo, text, isGap, highlights]
      properties:
        documentId: { type: integer }
        documentName: { type: string }
        docType: { oneOf: [{ $ref: "#/components/schemas/DocType" }, { type: "null" }] }
        language: { oneOf: [{ $ref: "#/components/schemas/DocLanguage" }, { type: "null" }] }
        pageNo: { type: integer }
        text: { type: string }
        isGap: { type: boolean }
        highlights:
          type: array
          items: { $ref: "#/components/schemas/SourceHighlight" }

    FindingDetail:
      allOf:
        - $ref: "#/components/schemas/Finding"
        - type: object
          required: [assessmentId, assessmentStatus, assessmentFinishedAt, model, bankName, productId, productName, isLatest, decision, history, sourcePages, prevId, nextId, nextUndecidedId]
          properties:
            assessmentId: { type: integer }
            assessmentStatus: { $ref: "#/components/schemas/AssessmentStatus" }
            assessmentFinishedAt: { type: ["string", "null"], format: date-time }
            model: { type: ["string", "null"] }
            bankName: { type: ["string", "null"] }
            productId: { type: ["integer", "null"] }
            productName: { type: ["string", "null"] }
            isLatest: { type: boolean, description: false when a newer assessment of the product exists; decisions are then closed }
            decision:
              oneOf:
                - { $ref: "#/components/schemas/Decision" }
                - { type: "null" }
            history:
              type: array
              description: Every decision on this finding, newest first
              items: { $ref: "#/components/schemas/Decision" }
            sourcePages:
              type: array
              items: { $ref: "#/components/schemas/SourcePage" }
            prevId: { type: ["integer", "null"], description: Previous finding in the review queue order }
            nextId: { type: ["integer", "null"] }
            nextUndecidedId: { type: ["integer", "null"], description: Next undecided finding after this one, wrapping around }

    BulkAcceptInput:
      type: object
      required: [role, assessmentId]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        assessmentId: { type: integer }
        examinerNote: { type: ["string", "null"], maxLength: 2000 }

    BulkAcceptResult:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer }
